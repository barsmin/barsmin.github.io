<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Lets the scroll animation start hidden without a flash. If main.js hasn't confirmed within 4 s,
       the class is removed again and everything simply shows. -->
  <script>
    document.documentElement.classList.add("js");
    setTimeout(function () {
      if (!document.documentElement.hasAttribute("data-reveal-ready")) document.documentElement.classList.remove("js");
    }, 4000);
  </script>
  <title>Projects — Cosmin</title>
  <meta name="description" content="Selected projects by Cosmin (barsmin).">
  <meta name="theme-color" content="#111315">
  <meta name="color-scheme" content="dark">
  <link rel="canonical" href="https://barsmin.github.io/projects.html">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;700&family=Space+Grotesk:wght@400;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body id="top">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container">
      <a class="logo" href="index.html">
        <!-- Phones get the small "ba" mark; tablets and desktops get the full logo -->
        <picture>
          <source media="(max-width: 899px)" srcset="assets/icons/logo-mobile.svg">
          <img src="assets/icons/logo.svg" alt="barsmin — home" width="88" height="20">
        </picture>
      </a>
      <nav class="nav" aria-label="Primary">
        <a href="index.html">personal information</a>
        <a href="projects.html" aria-current="page">projects</a>
      </nav>
    </div>
  </header>

  <main id="main">
    <!-- PLACEHOLDER: this page isn't designed in Figma yet. Replace this hero with your project grid. -->
    <section class="hero" aria-labelledby="page-title">
      <div class="container grid hero__grid">
        <div class="hero__text" data-reveal-group>
          <h1 id="page-title" class="hero__title"><span class="accent">projects.</span></h1>
          <p class="hero__lead">case studies are coming soon.</p>
          <a class="btn" href="index.html">back to home</a>
        </div>
        <div class="col-line hero__col-a" aria-hidden="true"></div>
        <div class="col-line hero__col-c" aria-hidden="true"></div>
        <div class="col-line hero__col-b" aria-hidden="true"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>© <span data-year>2026</span> barsmin. All rights reserved</p>
  </footer>

  <script src="js/main.js" defer></script>
</body>
</html>
